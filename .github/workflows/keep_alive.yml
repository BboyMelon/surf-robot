name: Keep Render Alive

on:
  schedule:
    # 原本24小時不間斷每5分鐘ping，會讓Render免費方案的instance hours
    # 額度提前燒完（醒著就算用量，不管有沒有人用）。改成只在尖峰時段
    # 保活：台灣05:00-10:00（對應05:00廣播+出發前查浪）、14:00-20:00
    # （對應15:00廣播+晚上規劃），換算UTC為21,22,23,0,1與6,7,8,9,10,11點
    - cron: '*/5 21,22,23,0,1,6,7,8,9,10,11 * * *'
  workflow_dispatch:        # 允許手動觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}" https://surf-robot.onrender.com/health || true
