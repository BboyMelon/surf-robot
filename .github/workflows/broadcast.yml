name: Daily Broadcast Trigger

on:
  schedule:
    - cron: '0 21 * * *'  # 台灣時間 05:00 (UTC 21:00)，唯一的每日廣播
  workflow_dispatch:        # 允許手動觸發測試

jobs:
  trigger-broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (wait until healthy)
        run: |
          echo "⏳ 等待 Render 服務喚醒..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://surf-robot.onrender.com/health --max-time 15 || echo "000")
            echo "  /health 嘗試 $i/12：HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ 服務已就緒"
              break
            fi
            sleep 10
          done

      - name: Trigger broadcast
        run: |
          echo "🌊 觸發浪況廣播..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              https://surf-robot.onrender.com/broadcast-now \
              -H "Authorization: Bearer ${{ secrets.BROADCAST_TOKEN }}" \
              --max-time 30 || echo "000")
            echo "  嘗試 $i/3：HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ 廣播觸發成功"
              exit 0
            fi
            sleep 15
          done
          echo "❌ 廣播觸發失敗（3次都不是200）"
          exit 1
