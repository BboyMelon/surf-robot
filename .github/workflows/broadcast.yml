name: Daily Broadcast Trigger

# 主觸發已改交給 cron-job.org（台灣05:00準時打 /broadcast-now，不受GitHub Actions
# schedule best-effort delay影響）。這支workflow降級為備援：往後移15分鐘，
# 且觸發前先查 /broadcast-status 確認今天真的還沒成功，才補打，避免跟
# cron-job.org重複觸發（邏輯比照 broadcast_retry.yml 2026-08-07 的修復）。

on:
  schedule:
    - cron: '15 21 * * *'  # 台灣時間 05:15 (UTC 21:15)，cron-job.org主排程後15分鐘的備援
  workflow_dispatch:        # 允許手動觸發測試

jobs:
  trigger-broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查今日是否已由 cron-job.org 成功推播
        id: check
        run: |
          SUCCESS="unknown"
          for i in 1 2 3; do
            RESPONSE=$(curl -s -m 15 -w "\n%{http_code}" \
              https://surf-robot.onrender.com/broadcast-status \
              -H "Authorization: Bearer ${{ secrets.BROADCAST_TOKEN }}" || printf "\n000")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "  查詢嘗試 $i/3：HTTP $HTTP_CODE，回應：$BODY"
            if [ "$HTTP_CODE" = "200" ]; then
              SUCCESS=$(echo "$BODY" | jq -r '.success // false')
              break
            fi
            sleep 10
          done
          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"

      - name: 今日已成功（cron-job.org已推播），跳過
        if: steps.check.outputs.success == 'true'
        run: echo "✅ 今日已由 cron-job.org 成功推播，不需備援觸發"

      - name: 狀態查詢連續失敗，保守跳過（避免誤判造成重複推播）
        if: steps.check.outputs.success == 'unknown'
        run: echo "⚠️ /broadcast-status 連續3次查詢都失敗，無法確認今日是否已推播成功。為避免誤判成false而重複推播，本次不觸發，請人工確認"

      - name: Wake up Render (wait until healthy)
        if: steps.check.outputs.success == 'false'
        run: |
          echo "⚠️ 今日確認尚無成功紀錄，準備備援觸發一次"
          echo "⏳ 等待 Render 服務喚醒..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://surf-robot.onrender.com/health --max-time 15 || echo "000")
            echo "  /health 嘗試 $i/12：HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ 服務已就緒"
              break
            fi
            sleep 10
          done

      - name: Trigger broadcast
        if: steps.check.outputs.success == 'false'
        run: |
          echo "🌊 觸發浪況廣播（備援）..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              https://surf-robot.onrender.com/broadcast-now \
              -H "Authorization: Bearer ${{ secrets.BROADCAST_TOKEN }}" \
              --max-time 30 || echo "000")
            echo "  嘗試 $i/3：HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ 廣播觸發成功"
              exit 0
            fi
            sleep 15
          done
          echo "❌ 廣播觸發失敗（3次都不是200）"
          exit 1
